#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-comfact-facade
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
  security:
    oauth2:
      client:
        registration:
          party:
            authorization-grant-type: client_credentials
            provider: party
          esigning:
            authorization-grant-type: client_credentials
            provider: esigning
mdc:
  municipalityId:
    enabled: true

integration:
  comfact:
    connectTimeout: 5
    readTimeout: 30
    # Token endpoint for the per-account OAuth2 client credentials stored in the account table
    token-url: ${TOKEN_URL_COMFACT}
  party:
    connectTimeout: 5
    readTimeout: 30
  esigning:
    connectTimeout: 5
    readTimeout: 30

properties:
  credentials:
    secret-key: ${SECRET_KEY}

logbook:
  body-filters:
    # Exclude content from incoming requests.
    json-path:
      - key: '$..content'
        value: '[binary]'
      - key: '$..clientSecret'
        value: '[hidden]'
